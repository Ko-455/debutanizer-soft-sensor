# Установка (один раз после клона):  make setup
# Ручной прогон по всем файлам:         poetry run pre-commit run --all-files
# Обновление ревизий хуков:             poetry run pre-commit autoupdate
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # Базовая гигиена файлов
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]  # не даём закоммитить датасет или модель
      - id: detect-private-key
      - id: debug-statements

  # Линтер + форматтер (заменяют flake8, isort, black, pyupgrade, bandit-lite)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Чистим выводы ноутбуков: в Git — только код, без картинок и данных
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # Хуки, которым нужны зависимости проекта, запускаются из его .venv
  - repo: local
    hooks:
      - id: poetry-check
        name: poetry check --lock (pyproject и poetry.lock согласованы)
        entry: poetry check --lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$

      - id: mypy
        name: mypy (strict)
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest + покрытие
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
