# Конфиг обучения. Любой ключ можно опустить — возьмётся значение по умолчанию
# из soft_sensor/config.py. Лишние ключи — ошибка (защита от опечаток).

data:
  path: data/raw/debutanizer.csv
  max_missing_fraction: 0.01

features:
  lags: [1, 2, 3, 4, 5, 6]
  add_bottom_temperature_mean: true

split:
  test_fraction: 0.2
  cv_splits: 5

model:
  candidates: [ridge, hgb]
  ridge:
    alpha: 1.0
  hgb:
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 31
  random_state: 42

artifacts_dir: models

# Автоматическое переобучение (см. Model_retrain_BPMN.md)
retrain:
  monitor:            # триггер по деградации
    window: 200       # последних анализов для оценки
    max_rmse_ratio: 1.5
    max_abs_bias: 0.02
  gates:              # проверки перед выкладкой
    min_train_samples: 500
    max_rmse: 0.05
    min_r2: 0.80       # санитарный порог, главный критерий — RMSE
    max_abs_bias: 0.02
    max_degradation: 0.02   # новая не хуже текущей более чем на 2 % по RMSE
    smoke_output_range: [-0.1, 1.1]
  registry_dir: models/registry
